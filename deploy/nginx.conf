# SiftCast nginx configuration — snapshot of the live config on the VPS.
# The HTTPS parts (443 block, redirect) are generated and managed by
# `sudo certbot --nginx -d siftcast.pekobit.com`; if you rebuild the server,
# deploy the plain HTTP block first, then run certbot to add TLS.

server {
    server_name siftcast.pekobit.com;

    # Serve index.html directly via nginx
    root /home/ubuntu/siftcast;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Proxy /api/* to Gunicorn
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Proxy /auth/* to Gunicorn (OAuth login flow)
    location /auth/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy /debug (owner-only admin page) to Gunicorn
    location /debug {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/siftcast.pekobit.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/siftcast.pekobit.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = siftcast.pekobit.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name siftcast.pekobit.com;
    return 404; # managed by Certbot
}
